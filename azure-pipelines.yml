trigger:
  branches:
    include:
      - main

variables:
  buildConfiguration: Release
  azureSubscription: 'Az_Connection'
  resourceGroup: 'rg-azan-test'
  location: 'uksouth'            # e.g. centralindia
  webAppName: 'eshopazantest'    # globally unique, lowercase

stages:
# ---------------------------------------------------------------- BUILD
- stage: Build
  displayName: Build and test
  jobs:
  - job: Build
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: DotNetCoreCLI@2
      displayName: Restore
      inputs:
        command: restore
        projects: '**/*.sln'
        feedsToUse: select

    - task: DotNetCoreCLI@2
      displayName: Build
      inputs:
        command: build
        projects: '**/*.sln'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: DotNetCoreCLI@2
      displayName: Unit tests
      inputs:
        command: test
        projects: 'tests/UnitTests/*.csproj'
        arguments: '--configuration $(buildConfiguration) --no-build'

    - task: DotNetCoreCLI@2
      displayName: Publish web project
      inputs:
        command: publish
        publishWebProjects: false
        projects: 'src/Web/Web.csproj'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/web'
        zipAfterPublish: true

    - task: PublishPipelineArtifact@1
      displayName: Publish artifact - Website
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/web'
        artifact: Website

    - task: PublishPipelineArtifact@1
      displayName: Publish artifact - Bicep
      inputs:
        targetPath: '$(Build.SourcesDirectory)/infra/webapp.bicep'
        artifact: Bicep

# ---------------------------------------------------------------- INFRA
- stage: Infra
  displayName: Provision Web App (Bicep)
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: Bicep
    pool:
      vmImage: ubuntu-latest
    steps:
    - download: current
      artifact: Bicep

    - task: AzureResourceManagerTemplateDeployment@3
      displayName: Deploy Bicep
      inputs:
        deploymentScope: Resource Group
        azureResourceManagerConnection: $(azureSubscription)
        action: Create Or Update Resource Group
        resourceGroupName: $(resourceGroup)
        location: $(location)
        templateLocation: Linked artifact
        csmFile: '$(Pipeline.Workspace)/Bicep/webapp.bicep'
        overrideParameters: '-webAppName $(webAppName)'
        deploymentMode: Incremental

# --------------------------------------------------------------- DEPLOY
- stage: Deploy
  displayName: Deploy to Web App
  dependsOn: Infra
  condition: succeeded()
  jobs:
  - deployment: DeployWeb
    environment: staging
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: Deploy to App Service
            inputs:
              azureSubscription: $(azureSubscription)
              appType: webAppLinux          # change to webApp if Bicep creates a Windows app
              appName: $(webAppName)
              package: '$(Pipeline.Workspace)/Website/*.zip'



# ------------------------------------------------------------------ DAST
- stage: DAST
  displayName: OWASP ZAP baseline scan
  dependsOn: Deploy
  condition: succeeded()
  jobs:
  - job: ZAP
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: none

    - script: curl --retry 10 --retry-delay 10 --retry-connrefused -sf https://$(webAppName).azurewebsites.net
      displayName: Wait for app

    - script: |
        mkdir -p $(Pipeline.Workspace)/zap
        chmod 777 $(Pipeline.Workspace)/zap
      displayName: Prepare report folder

    - script: |
        docker run --rm \
          -v $(Pipeline.Workspace)/zap:/zap/wrk:rw \
          ghcr.io/zaproxy/zaproxy:stable \
          zap-baseline.py \
            -t https://$(webAppName).azurewebsites.net \
            -r zap-report.html \
            -J zap-report.json \
            -I
      displayName: Run ZAP baseline scan

    - task: PublishPipelineArtifact@1
      displayName: Publish ZAP reports
      condition: always()
      inputs:
        targetPath: '$(Pipeline.Workspace)/zap'
        artifact: ZAP-Report