trigger:
- none
#  branches:
#    include:
#      - main


variables:
  buildConfiguration: Release
  azureSubscription: 'Az_Connection'
  resourceGroup: 'rg-azan-test'
  location: 'uksouth'
  webAppName: 'eshopazantest'
  slotName: 'staging'
  stagingUrl: 'https://eshopazantest-staging.azurewebsites.net'

stages:
# ---------------------------------------------------------------- BUILD
- stage: Build
  displayName: Build and test
  jobs:
  - job: Build
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: DotNetCoreCLI@2
      displayName: Restore
      inputs:
        command: restore
        projects: '**/*.sln'
        feedsToUse: select

    - task: DotNetCoreCLI@2
      displayName: Build
      inputs:
        command: build
        projects: '**/*.sln'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: DotNetCoreCLI@2
      displayName: Unit tests
      inputs:
        command: test
        projects: 'tests/UnitTests/*.csproj'
        arguments: '--configuration $(buildConfiguration) --no-build'

    - task: DotNetCoreCLI@2
      displayName: Publish web project
      inputs:
        command: publish
        publishWebProjects: false
        projects: 'src/Web/Web.csproj'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/web'
        zipAfterPublish: true

    - task: PublishPipelineArtifact@1
      displayName: Publish artifact - Website
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/web'
        artifact: Website

    - task: PublishPipelineArtifact@1
      displayName: Publish artifact - Bicep
      inputs:
        targetPath: '$(Build.SourcesDirectory)/infra/webapp.bicep'
        artifact: Bicep

# ---------------------------------------------------------------- INFRA
- stage: Infra
  displayName: Provision Web App and staging slot
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: Bicep
    pool:
      vmImage: ubuntu-latest
    steps:
    - download: current
      artifact: Bicep

    - task: AzureResourceManagerTemplateDeployment@3
      displayName: Deploy Bicep (Web App)
      inputs:
        deploymentScope: Resource Group
        azureResourceManagerConnection: $(azureSubscription)
        action: Create Or Update Resource Group
        resourceGroupName: $(resourceGroup)
        location: $(location)
        templateLocation: Linked artifact
        csmFile: '$(Pipeline.Workspace)/Bicep/webapp.bicep'
        overrideParameters: '-webAppName $(webAppName)'
        deploymentMode: Incremental

    - task: AzureCLI@2
      displayName: Create staging slot (if missing)
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          if az webapp deployment slot list -g $(resourceGroup) -n $(webAppName) --query "[?name=='$(slotName)']" -o tsv | grep -q .; then
            echo "Slot $(slotName) already exists"
          else
            az webapp deployment slot create \
              -g $(resourceGroup) -n $(webAppName) \
              --slot $(slotName) \
              --configuration-source $(webAppName)
          fi

# ------------------------------------------------- DEPLOY TO STAGING SLOT
- stage: DeployStaging
  displayName: Deploy to staging slot
  dependsOn: Infra
  condition: succeeded()
  jobs:
  - deployment: DeploySlot
    environment: staging
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: Deploy to staging slot
            inputs:
              azureSubscription: $(azureSubscription)
              appType: webAppLinux
              appName: $(webAppName)
              deployToSlotOrASE: true
              resourceGroupName: $(resourceGroup)
              slotName: $(slotName)
              package: '$(Pipeline.Workspace)/Website/*.zip'

# ------------------------------------------------------------- ZAP SCAN
- stage: DAST
  displayName: OWASP ZAP scan (staging slot)
  dependsOn: DeployStaging
  condition: succeeded()
  jobs:
  - job: ZAP
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: none

    - script: |
        curl --retry 15 --retry-delay 10 --retry-all-errors -sf -o /dev/null $(stagingUrl)
      displayName: Wait for staging slot

    - script: |
        mkdir -p $(Pipeline.Workspace)/zap
        chmod 777 $(Pipeline.Workspace)/zap
      displayName: Prepare report folder

    - script: |
        docker run --rm \
          -v $(Pipeline.Workspace)/zap:/zap/wrk:rw \
          ghcr.io/zaproxy/zaproxy:stable \
          zap-baseline.py \
            -t $(stagingUrl) \
            -r zap-report.html \
            -J zap-report.json \
            -w zap-summary.md \
            -I
      displayName: Run ZAP baseline scan

    - script: |
        echo "##vso[task.uploadsummary]$(Pipeline.Workspace)/zap/zap-summary.md"
      displayName: Show ZAP summary on run page
      condition: always()

    - task: PublishPipelineArtifact@1
      displayName: Publish ZAP reports
      condition: always()
      inputs:
        targetPath: '$(Pipeline.Workspace)/zap'
        artifact: ZAP-Report

# --------------------------------------------- APPROVE AND SWAP TO PRODUCTION
- stage: SwapToProd
  displayName: Approve and swap to production
  dependsOn: DAST
  condition: succeeded()
  jobs:
  - deployment: Swap
    environment: production
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureAppServiceManage@0
            displayName: Swap staging slot into production
            inputs:
              azureSubscription: $(azureSubscription)
              Action: 'Swap Slots'
              WebAppName: $(webAppName)
              ResourceGroupName: $(resourceGroup)
              SourceSlot: $(slotName)
              SwapWithProduction: true